<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.6" stop-color="#1e293b"/><stop offset="1" stop-color="#0f766e"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.08"/></pattern></defs><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#0f172a"/><rect width="1080" height="1080" fill="url(#dots)"/><text x="70" y="110" font-size="22" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="4">COLLAUDO GDPR · INFORMATIVA CONTRO CODICE</text><text x="70" y="190" font-size="68" fill="#f8fafc" font-weight="800" text-anchor="start" >L'informativa dice una cosa,</text><text x="70" y="268" font-size="68" fill="#f8fafc" font-weight="800" text-anchor="start" >il codice ne fa un'altra</text><text x="70" y="340" font-size="28" fill="#e2e8f0" font-weight="400" text-anchor="start" >Anonimizzato · analisi statica e documentale</text><rect x="70" y="430" width="425" height="330" rx="18" fill="#1e293b" stroke="#14b8a6" stroke-width="3"/><text x="100" y="486" font-size="30" fill="#14b8a6" font-weight="800" text-anchor="start" >L'informativa dice</text><circle cx="110" cy="546" r="7" fill="#14b8a6"/><text x="132" y="553" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Server nell'Unione Europea</text><circle cx="110" cy="612" r="7" fill="#14b8a6"/><text x="132" y="619" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Nessun trasferimento fuori SEE</text><circle cx="110" cy="678" r="7" fill="#14b8a6"/><text x="132" y="685" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Destinatari non nominati</text><rect x="585" y="430" width="425" height="330" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="615" y="486" font-size="30" fill="#f59e0b" font-weight="800" text-anchor="start" >Il codice fa</text><circle cx="625" cy="546" r="7" fill="#f59e0b"/><text x="647" y="553" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Font e icone da Google</text><circle cx="625" cy="612" r="7" fill="#f59e0b"/><text x="647" y="619" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Messaggi inviati via Twilio</text><circle cx="625" cy="678" r="7" fill="#f59e0b"/><text x="647" y="685" font-size="23" fill="#f8fafc" font-weight="400" text-anchor="start" >Backup su Google Drive</text><text x="540" y="622" font-size="64" fill="#f59e0b" font-weight="800" text-anchor="middle" >≠</text><rect x="70" y="790" width="940" height="150" rx="16" fill="#1e293b" stroke="#14b8a6" stroke-width="2" stroke-dasharray="8 6"/><text x="100" y="836" font-size="26" fill="#5eead4" font-weight="700" text-anchor="start" >Cosa non dice la skill: «siete conformi»</text><text x="100" y="876" font-size="24" fill="#f8fafc" font-weight="400" text-anchor="start" >Porta fatti e 12 domande già pronte a titolare, DPO e legale.</text><text x="100" y="912" font-size="24" fill="#f8fafc" font-weight="400" text-anchor="start" >14 controlli: 4 non verificabili, dichiarati come tali.</text><text x="70" y="1018" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="start" >gdpr-sentinel · skill per Claude</text><text x="1010" y="1018" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="end" >Apache-2.0 · in italiano</text></svg>
