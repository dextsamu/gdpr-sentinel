"490" height="220" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="598" y="114" font-size="14" fill="#5eead4" font-weight="800" text-anchor="start" letter-spacing="1">DOMANDA · Q04  Titolare e DPO</text><text x="598" y="160" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >L'informativa va aggiornata con i destinatari reali?</text><text x="598" y="186" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Per i fornitori statunitensi: DPF o clausole tipo?</text><text x="598" y="238" font-size="16" fill="#94a3b8" font-weight="400" text-anchor="start" >Materiale: elenco fornitori, contratti (DPA).</text><text x="598" y="264" font-size="16" fill="#94a3b8" font-weight="400" text-anchor="start" >Da verificare alla fonte ora, non da memoria.</text></svg>
