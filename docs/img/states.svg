<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs></defs><rect x="0" y="0" width="1200" height="320" rx="22" fill="#0f172a"/><text x="600" y="52" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="middle" >Quattro stati ammessi, nessun giudizio di conformità</text><rect x="27" y="90" width="270" height="170" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><circle cx="55" cy="126" r="9" fill="#22c55e"/><text x="75" y="134" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >riscontrato</text><text x="51" y="176" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >evidenza tecnica o</text><text x="51" y="202" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >documentale diretta</text><rect x="319" y="90" width="270" height="170" rx="18" fill="#1e293b" stroke="#14b8a6" stroke-width="3"/><circle cx="347" cy="126" r="9" fill="#14b8a6"/><text x="367" y="134" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >confermato</text><text x="343" y="176" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >da codice/config</text><text x="343" y="202" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >letto, non eseguito</text><rect x="611" y="90" width="270" height="170" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><circle cx="639" cy="126" r="9" fill="#f59e0b"/><text x="659" y="134" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >ipotesi</text><text x="635" y="176" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >plausibile ma</text><text x="635" y="202" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >da validare</text><rect x="903" y="90" width="270" height="170" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><circle cx="931" cy="126" r="9" fill="#94a3b8"/><text x="951" y="134" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >non verificabile</text><text x="927" y="176" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >mancano documenti o</text><text x="927" y="202" font-size="18" fill="#e2e8f0" font-weight="400" text-anchor="start" >accessi: serve una domanda</text><text x="600" y="298" font-size="16" fill="#94a3b8" font-weight="400" text-anchor="middle" >«Conforme» e «non conforme» non esistono: lo script check_matrix.py le rifiuta.</text></svg>
