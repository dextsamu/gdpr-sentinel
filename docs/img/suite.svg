<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="1100" height="360" rx="22" fill="#0f172a"/><text x="32" y="52" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="start" >Le due skill insieme</text><text x="1068" y="52" font-size="15" fill="#5eead4" font-weight="600" text-anchor="end" >indipendenti, ma fatte per lavorare in coppia</text><rect x="32" y="84" width="300" height="200" rx="18" fill="#1e293b" stroke="#14b8a6" stroke-width="3"/><circle cx="72" cy="124" r="22" fill="#14b8a6"/><text x="108" y="122" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >appsec-sentinel</text><text x="108" y="146" font-size="15" fill="#14b8a6" font-weight="700" text-anchor="start" >SICUREZZA</text><text x="56" y="184" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >Codice, API, infrastruttura,</text><text x="56" y="212" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >dipendenze, accessi.</text><text x="56" y="240" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >Finding con prova e stato.</text><rect x="768" y="84" width="300" height="200" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><circle cx="808" cy="124" r="22" fill="#f59e0b"/><text x="844" y="122" font-size="23" fill="#f8fafc" font-weight="800" text-anchor="start" >gdpr-sentinel</text><text x="844" y="146" font-size="15" fill="#f59e0b" font-weight="700" text-anchor="start" >PRIVACY</text><text x="792" y="184" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >Trattamenti reali, informativa,</text><text x="792" y="212" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >fornitori, retention, diritti.</text><text x="792" y="240" font-size="17" fill="#e2e8f0" font-weight="400" text-anchor="start" >Matrice A–N e domande.</text><rect x="380" y="98" width="340" height="172" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/><text x="550" y="134" font-size="19" fill="#f8fafc" font-weight="700" text-anchor="middle" >Cartella di audit condivisa</text><text x="550" y="164" font-size="16" fill="#94a3b8" font-weight="500" text-anchor="middle" >finding · matrici · documentale</text><text x="550" y="190" font-size="16" fill="#94a3b8" font-weight="500" text-anchor="middle" >meta.json</text><rect x="440" y="208" width="220" height="44" rx="22" fill="#14b8a6"/><text x="550" y="237" font-size="18" fill="#0f172a" font-weight="800" text-anchor="middle" >un solo report PDF</text><path d="M332,184 L380,184" stroke="#94a3b8" stroke-width="4" marker-end="url(#arr)"/><path d="M768,184 L720,184" stroke="#94a3b8" stroke-width="4" marker-end="url(#arr)"/><text x="100" y="324" font-size="16" fill="#5eead4" font-weight="600" text-anchor="start" >appsec → privacy: «privacy &lt;repo&gt;»</text><text x="1000" y="324" font-size="16" fill="#f59e0b" font-weight="600" text-anchor="end" >gdpr → sicurezza: «sicurezza &lt;repo&gt;»</text></svg>
