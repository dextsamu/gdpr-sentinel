name: Release

# Automatico: quando cambia la versione in .claude-plugin/plugin.json su main, crea il tag v<versione> e la release
# con le note del CHANGELOG e il pacchetto .skill. Funziona anche con un tag v* creato a mano o lanciato a mano.
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else
            tag="v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"; fi
          grep -q "^## \[${tag#v}\]" CHANGELOG.md || { echo "manca la sezione [${tag#v}] nel CHANGELOG"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Pacchetto della skill
        run: |
          mkdir -p dist/gdpr-sentinel
          cp -r SKILL.md LICENSE NOTICE references assets scripts dist/gdpr-sentinel/
          find dist -name "__pycache__" -prune -exec rm -rf {} +
          (cd dist && zip -qr gdpr-sentinel.skill gdpr-sentinel)
          unzip -l dist/gdpr-sentinel.skill
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # release già esistente (creata a mano o in un giro precedente): aggiorna solo l'allegato
          # (se un errore di GitHub l'ha lasciata in bozza a metà creazione, la pubblica)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/gdpr-sentinel.skill --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --draft=false --latest
            fi
            exit 0
          fi
          gh release create "$TAG" dist/gdpr-sentinel.skill --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file <(awk -v v="${TAG#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md)
