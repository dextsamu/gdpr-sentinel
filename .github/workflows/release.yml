name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pacchetto della skill
        run: |
          mkdir -p dist/gdpr-sentinel
          cp -r SKILL.md LICENSE NOTICE references assets scripts dist/gdpr-sentinel/
          find dist -name "__pycache__" -prune -exec rm -rf {} +
          (cd dist && zip -qr gdpr-sentinel.skill gdpr-sentinel)
          unzip -l dist/gdpr-sentinel.skill
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se la release è già stata creata a mano, aggiorna solo l'allegato
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/gdpr-sentinel.skill --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" dist/gdpr-sentinel.skill \
            --title "${GITHUB_REF_NAME}" \
            --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md)
